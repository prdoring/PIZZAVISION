<!-- templates/awards_presentation.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for('voting.static', filename='pizza.png') }}">
    <link rel="stylesheet" href="{{ url_for('voting.static', filename='presentation.css') }}">

    <title>PIZZAWARDS</title>
    <style>
        /* Awards-specific typography. Shared chrome (logo, slides, bg-layer,
           cascade, drop-reveal, pulse-title, progress, controls, confetti)
           lives in presentation.css. */
        .award-title {
            font-size: 4.5rem;
            margin-bottom: 0.5rem;
            text-align: center;
            color: #e0e0e0;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .award-subtext {
            font-size: 2.5rem;
            color: #e0e0e0;
            margin-top: 1rem;
            text-align: center;
            max-width: 800px;
        }
        .award-insight {
            font-size: 1.8rem;
            color: #e0e0e0;
            margin-top: 1rem;
            text-align: center;
            max-width: 800px;
        }
        .winner-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .winner-total {
            font-size: 4rem;
            color: #ffd700;
            font-weight: bold;
            text-align: center;
            margin-top: 1.2rem;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-variant-numeric: tabular-nums;
        }
        .winner-stats {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            align-items: center;
        }
        .stat-row {
            font-size: 1.6rem;
            color: #e0e0e0;
            background: rgba(255, 215, 0, 0.08);
            border-left: 4px solid #ffd700;
            padding: 0.5rem 1.2rem;
            border-radius: 6px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .error-message {
            background: rgba(255, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            max-width: 800px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <!-- Logo that appears on all slides -->
    <img src="{{ url_for('voting.static', filename='pv25.png') }}" alt="PV25 Logo" class="logo">

    <!-- Single Ken-Burns'ing background layer, shared across all slides.
         Only the .slide-content cards crossfade above it. -->
    <div class="bg-layer" id="bg-layer"></div>

    <div class="presentation-container" id="presentation">
        <!-- Slides will be dynamically created here -->
        <!-- Loading indicator -->
        <div class="slide active">
            <div class="slide-overlay"></div>
            <div class="slide-content">
                <div class="award-title cascade">Loading Awards...</div>
                <div class="award-subtext cascade" style="--delay: 0.3s">Please wait</div>
            </div>
        </div>
    </div>

    <!-- Reuse the same party-horn sound the results page uses. A random
         toot segment is picked per reveal, so each award sounds different. -->
    <audio id="partyHornSound" preload="auto" style="display:none;">
        <source src="{{ url_for('voting.static', filename='party-horn.mp3') }}" type="audio/mpeg">
    </audio>

    <div class="controls">
        <div>← Previous | Next →</div>
        <div>Press arrow keys or spacebar to navigate</div>
    </div>

    <div class="progress">
        <div id="slide-counter">Slide 1 of 1</div>
        <div class="progress-bar" id="progress-bar">
            <!-- Progress indicators will be added here -->
            <div class="progress-step active"></div>
        </div>
    </div>

    <script src="{{ url_for('voting.static', filename='presentation.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Award data will be loaded from the server
            let awards = [];
            let currentSlideIndex = 0;
            let totalSlides = 0;

            // Fallback awards in case the API fails
            const fallbackAwards = [
                {
                    "award": "🎤 Pop Diva 🎤",
                    "winner": "John Doe",
                    "subtext": "For exceptional taste in pop music"
                },
                {
                    "award": "🎸 Rockstar 🎸",
                    "winner": "Jane Smith",
                    "subtext": "For rocking the hardest"
                },
                {
                    "award": "🪕 Folk Hero 🪕",
                    "winner": "Bob Johnson",
                    "subtext": "For keeping traditions alive"
                }
            ];

            // Try to load award data - use hardcoded URL to avoid template rendering issues
            fetch('/pizzavision/api/awards')
                .then(response => {
                    if (!response.ok) {
                        console.error("API Error:", response.status, response.statusText);
                        throw new Error(`API Error: ${response.status} ${response.statusText}`);
                    }
                    return response.text(); // Get the raw text first to debug
                })
                .then(text => {
                    try {
                        // Try to parse the JSON response
                        const data = JSON.parse(text);
                        console.log("Awards data loaded successfully:", data);
                        awards = data;
                        createSlides(awards);
                        initializePresentation();
                    } catch (e) {
                        console.error("JSON Parse Error:", e);
                        console.log("Raw response:", text);
                        throw new Error(`Failed to parse JSON: ${e.message}. API returned: ${text.substring(0, 100)}...`);
                    }
                })
                .catch(error => {
                    console.error("Error loading awards:", error);

                    // Show error and use fallback data
                    const presentation = document.getElementById('presentation');
                    presentation.innerHTML = `
                        <div class="slide active">
                            <div class="slide-overlay"></div>
                            <div class="slide-content">
                                <div class="award-title cascade">PIZZAVISION AWARDS</div>
                                <div class="award-subtext cascade" style="--delay: 0.4s">2026</div>
                                <div class="error-message">
                                    Failed to load awards from API. Using sample data instead.<br>
                                    Error: ${error.message}
                                </div>
                            </div>
                        </div>
                    `;

                    // Use fallback awards
                    setTimeout(() => {
                        awards = fallbackAwards;
                        createSlides(awards);
                        initializePresentation();
                    }, 3000); // Show the error for 3 seconds before proceeding
                });

            function resolveImageUrl(url) {
                if (!url) return null;
                if (url.startsWith('/static/')) {
                    return '/pizzavision/voting' + url;
                }
                return url;
            }

            function buildSlide({bgUrl, contentHtml, dataAttrs = {}}) {
                const slide = document.createElement('div');
                slide.className = 'slide';
                Object.entries(dataAttrs).forEach(([k, v]) => slide.dataset[k] = v);
                if (bgUrl) slide.dataset.bgUrl = bgUrl;
                const overlay = document.createElement('div');
                overlay.className = 'slide-overlay';
                slide.appendChild(overlay);
                const content = document.createElement('div');
                content.className = 'slide-content';
                content.innerHTML = contentHtml;
                slide.appendChild(content);
                return slide;
            }

            function createSlides(awards) {
                const presentationContainer = document.getElementById('presentation');
                presentationContainer.innerHTML = '';

                // Title slide
                presentationContainer.appendChild(buildSlide({
                    bgUrl: '/pizzavision/voting/static/images/jj.jpg',
                    contentHtml: `
                        <div class="award-title cascade">PIZZAVISION AWARDS</div>
                        <div class="award-subtext cascade" style="--delay: 0.4s">2026</div>
                    `
                }));

                // For each award: announcement slide + winner slide
                awards.forEach((award) => {
                    const bgUrl = resolveImageUrl(award.image_url);

                    // Announcement: title → subtext → insight, staggered
                    presentationContainer.appendChild(buildSlide({
                        bgUrl,
                        contentHtml: `
                            <div class="award-title cascade">${award.award}</div>
                            ${award.subtext ? `<div class="award-subtext cascade" style="--delay: 0.35s">${award.subtext}</div>` : ''}
                            <div class="award-insight cascade" style="--delay: 0.7s">${award.insight}</div>
                        `
                    }));

                    // Winner reveal: title pulses, name drops at 1.5s, total at 2.4s,
                    // stats cascade thereafter ~250ms apart.
                    const statsHtml = (award.stats && award.stats.length)
                        ? `<div class="winner-stats">${
                            award.stats.map((s, i) => {
                                const delay = (2.7 + i * 0.25).toFixed(2);
                                return `<div class="stat-row cascade" style="--delay: ${delay}s">${s}</div>`;
                            }).join('')
                          }</div>`
                        : '';

                    const totalAttrs = award.winner_total_value !== undefined
                        ? `data-target="${award.winner_total_value}" data-kind="${award.winner_total_kind}"`
                        : '';
                    const totalHtml = award.winner_total
                        ? `<div class="winner-total cascade" style="--delay: 2.4s" ${totalAttrs}>${award.winner_total}</div>`
                        : '';

                    presentationContainer.appendChild(buildSlide({
                        bgUrl,
                        dataAttrs: {
                            kind: 'winner',
                            code: award.code || '',
                            theme: confettiThemeFor(award.code)
                        },
                        contentHtml: `
                            <div class="winner-title pulse-title">And the winner is...</div>
                            <div class="drop-reveal">${award.winner}</div>
                            ${totalHtml}
                            ${statsHtml}
                        `
                    }));
                });

                const slides = document.querySelectorAll('.slide');
                totalSlides = slides.length;
                if (slides.length > 0) {
                    slides[0].classList.add('active');
                    PVPresentation.applyBackgroundFor(slides[0]);
                }

                createProgressIndicators(totalSlides);
                updateSlideCounter();
            }

            function createProgressIndicators(count) {
                const progressBar = document.getElementById('progress-bar');
                progressBar.innerHTML = '';

                for (let i = 0; i < count; i++) {
                    const indicator = document.createElement('div');
                    indicator.className = 'progress-step';
                    if (i === 0) indicator.classList.add('active');
                    progressBar.appendChild(indicator);
                }
            }

            function initializePresentation() {
                PVPresentation.registerNavigation({
                    onForward: nextSlide,
                    onBack: previousSlide,
                    clickMode: 'half',
                });
            }

            // -------- Count-up formatters (awards-specific big-total displays) --------
            function fmtGdpJs(n) {
                n = Math.abs(n);
                if (n >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
                if (n >= 1e9)  return '$' + (n/1e9).toFixed(1) + 'B';
                if (n >= 1e6)  return '$' + (n/1e6).toFixed(1) + 'M';
                return '$' + Math.round(n).toLocaleString();
            }
            function fmtPopJs(n) {
                n = Math.abs(n);
                if (n >= 1e9) return (n/1e9).toFixed(2) + 'B people';
                if (n >= 1e6) return (n/1e6).toFixed(1) + 'M people';
                return Math.round(n).toLocaleString() + ' people';
            }

            // -------- Slide navigation --------
            // Slide index layout:
            //   0           = title card
            //   1, 3, 5,... = award announcement
            //   2, 4, 6,... = winner reveal (themed reveal + confetti + audio)
            function isWinnerSlide(idx) { return idx > 0 && idx % 2 === 0; }
            function isAnnounceSlide(idx) { return idx > 0 && idx % 2 === 1; }

            function nextSlide() {
                if (currentSlideIndex < totalSlides - 1) {
                    updateSlide(currentSlideIndex + 1);
                }
            }

            function previousSlide() {
                if (currentSlideIndex > 0) {
                    updateSlide(currentSlideIndex - 1);
                }
            }

            function updateSlide(newIndex) {
                const slides = document.querySelectorAll('.slide');
                slides[currentSlideIndex].classList.remove('active');
                slides[newIndex].classList.add('active');

                PVPresentation.applyBackgroundFor(slides[newIndex]);

                const indicators = document.querySelectorAll('.progress-step');
                if (indicators[currentSlideIndex]) {
                    indicators[currentSlideIndex].classList.remove('active');
                    if (newIndex > currentSlideIndex) {
                        indicators[currentSlideIndex].classList.add('visited');
                    }
                }
                if (indicators[newIndex]) {
                    indicators[newIndex].classList.add('active');
                    indicators[newIndex].classList.remove('visited');
                }

                // Stop any lingering audio from a previous reveal
                PVPresentation.stopPartyHorn();

                // Winner reveal choreography
                if (isWinnerSlide(newIndex)) {
                    const slide = slides[newIndex];
                    const theme = slide.dataset.theme || 'default';

                    // 1.5s — name drops; party horn toots; confetti starts
                    setTimeout(() => {
                        PVPresentation.playPartyHorn();
                        PVPresentation.createConfetti(theme);
                    }, 1500);
                    setTimeout(() => PVPresentation.createConfetti(theme), 2000);
                    setTimeout(() => PVPresentation.createConfetti(theme), 2700);

                    // 2.4s — count up the big total (matches the CSS delay
                    // on .winner-total so the slot-machine starts as it appears)
                    const totalEl = slide.querySelector('.winner-total');
                    if (totalEl && totalEl.dataset.target) {
                        const target = parseFloat(totalEl.dataset.target);
                        const kind = totalEl.dataset.kind;
                        const fmt = kind === 'gdp' ? fmtGdpJs : fmtPopJs;
                        totalEl.textContent = fmt(0);
                        setTimeout(() => PVPresentation.animateCountUp(totalEl, target, fmt), 2400);
                    }
                }

                currentSlideIndex = newIndex;
                updateSlideCounter();
            }

            function updateSlideCounter() {
                const el = document.getElementById('slide-counter');
                if (currentSlideIndex === 0) {
                    el.textContent = `Title — ${awards.length} awards ahead`;
                    return;
                }
                const awardNumber = Math.ceil(currentSlideIndex / 2);
                const totalAwards = awards.length;
                const subLabel = isWinnerSlide(currentSlideIndex) ? '— winner' : '— intro';
                el.textContent = `Award ${awardNumber} of ${totalAwards} ${subLabel}`;
            }

            // -------- Awards-specific confetti theme mapping --------
            function confettiThemeFor(code) {
                return {
                    "Moneybags": "money", "Slummin' It": "money",
                    "Extrovert": "people", "Introvert": "people",
                    "Nordic Friend Zone": "nordic",
                    "Pop Diva": "pop",
                    "Rockstar": "rock",
                    "Folk Hero": "folk",
                    "Mr. Roboto": "techno",
                    "Crooner": "ballad",
                    "A Bottle Of Red": "wine_r",
                    "A Bottle Of White": "wine_w",
                    "A Bottle Of Beer": "beer",
                    "For the Girls": "girls",
                    "Polyglot": "lang",
                    "Red George": "soviet",
                    "Call me Dadoi": "nordic",
                    "Lone Wolf": "solo",
                    "Squad Goals": "squad",
                    "Voice of the People": "vote",
                    "Welcome Back": "back",
                    "Tastemaker": "meta",
                    "Contrarian": "meta",
                    "Twinzies": "twin",
                    "Big 5": "big5",
                }[code] || "default";
            }
        });
    </script>
</body>
</html>
